<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Animated Title</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./image/sh1ft3r-logo.ico" sizes="32x32">
    <link rel="icon" href="./image/sh1ft3r-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./image/apple-touch-icon.png">
</head>
<body>
    <h1>
        <span style='--start-color:#007CF0; --end-color:#00DFD8; --delay: 0s;'>Develop.</span>
        <span style='--start-color:#7928CA; --end-color:#FF0080; --delay: 2.4s;'>Preview.</span>
        <span style='--start-color:#FF4D4D; --end-color:#F9CB28; --delay: 4.8s;'>Ship.</span>
    </h1>
</body>
</html>
